# DNS-only (grey cloud), same as bale-adaptor.boostsho.ir.
# The stream SNI router owns :443 and forwards here with PROXY protocol.
# This vhost listens on 127.0.0.1:8443, then proxies to 127.0.0.1:8788.
# The API itself requires a bearer token except /healthz.
#
# Client IP is the PROXY protocol address. This host is not behind the
# Cloudflare proxy, so CF-Connecting-IP is not set. snippets/cloudflare-realip.conf
# is not included: it sets real_ip_header CF-Connecting-IP, and only one
# real_ip_header is allowed per context. Trusting 127.0.0.1 for that header
# would accept a client-spoofed address.

server {
    listen 80;
    listen [::]:80;
    server_name whatsapp-adaptor.boostsho.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name whatsapp-adaptor.boostsho.ir;

    ssl_certificate /etc/letsencrypt/live/whatsapp-adaptor.boostsho.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whatsapp-adaptor.boostsho.ir/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 64k;

    location = /healthz {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8788;
    }

    location = /readyz {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8788;
    }

    location ^~ /v1/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8788;
    }

    location / {
        return 404;
    }
}
