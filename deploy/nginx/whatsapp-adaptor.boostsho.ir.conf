# DNS-only (grey cloud), same as bale-adaptor.boostsho.ir.
# nginx → 127.0.0.1:8788. The API itself requires a bearer token except /healthz.

server {
    listen 80;
    listen [::]:80;
    server_name whatsapp-adaptor.boostsho.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name whatsapp-adaptor.boostsho.ir;

    ssl_certificate /etc/letsencrypt/live/whatsapp-adaptor.boostsho.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whatsapp-adaptor.boostsho.ir/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 64k;

    location = /healthz {
        include snippets/cloudflare-realip.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8788;
    }

    location = /readyz {
        include snippets/cloudflare-realip.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8788;
    }

    location ^~ /v1/ {
        include snippets/cloudflare-realip.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8788;
    }

    location / {
        return 404;
    }
}
